# FOUND-10: cargo deny gating. NEW PATTERN — no sibling precedent.

[advisories]
db-path = "~/.cargo/advisory-db"
db-urls = ["https://github.com/rustsec/advisory-db"]
yanked = "deny"
ignore = []

[licenses]
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "MIT",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-DFS-2016",
    "Unicode-3.0",
    "Zlib",
    "MPL-2.0",
    "CC0-1.0",
]
confidence-threshold = 0.8

[bans]
multiple-versions = "warn"
wildcards = "deny"
deny = [
    # Static-only distribution per DIST-04/DIST-05; reject any system-link
    # vector.
    { name = "openssl-sys" },
    { name = "system-deps" },
]

[sources]
unknown-registry = "deny"
unknown-git      = "deny"
allow-registry   = ["https://github.com/rust-lang/crates.io-index"]
allow-git = [
    "https://github.com/BectorVoom/cintx",
    "https://github.com/BectorVoom/libxc_rs",
    "https://github.com/BectorVoom/xcfun_rs",
]
