# FOUND-10: cargo deny gating. NEW PATTERN — no sibling precedent.

[advisories]
db-path = "~/.cargo/advisory-db"
db-urls = ["https://github.com/rustsec/advisory-db"]
yanked = "deny"
ignore = [
    # `paste` is unmaintained (RUSTSEC-2024-0436) but is pulled only
    # transitively via cubecl/faer proc-macro deps. No maintained drop-in
    # exists and there is no known vulnerability — transitive, advisory-only.
    # Revisit when cubecl/faer drop it. (Plan 01-08 FOUND-10 closure.)
    "RUSTSEC-2024-0436",
]

[licenses]
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "MIT",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-DFS-2016",
    "Unicode-3.0",
    "Zlib",
    "MPL-2.0",
    "CC0-1.0",
    # Added in Plan 01-08 (FOUND-10): permissive licenses surfaced once the
    # committed Cargo.lock let `cargo deny` run end-to-end for the first time.
    "HDF5",                 # hdf5-metno-src — HDF Group BSD-style license
    "CDLA-Permissive-2.0",  # webpki-roots
    "BSL-1.0",              # xxhash-rust — Boost Software License
]
confidence-threshold = 0.8
# First-party BectorVoom path-dep crates (cintx-*, xcfun-core) ship without a
# `license` field and are vendored locally via [patch.crates-io] path deps
# (never published). Ignore private/unpublished crates for license checks.
private = { ignore = true }

# The first-party path-dep crates omit a per-crate `license` field and have no
# per-crate LICENSE file, so cargo-deny cannot auto-detect. Clarify from ground
# truth: cintx ships an MIT LICENSE at its repo root (Copyright (c) 2026 Zone);
# xcfun-core is MPL-2.0 like all 7 of its sibling xcfun-* crates. (Plan 01-08.)
[[licenses.clarify]]
name = "cintx-compat"
expression = "MIT"
license-files = []

[[licenses.clarify]]
name = "cintx-core"
expression = "MIT"
license-files = []

[[licenses.clarify]]
name = "cintx-cubecl"
expression = "MIT"
license-files = []

[[licenses.clarify]]
name = "cintx-ops"
expression = "MIT"
license-files = []

[[licenses.clarify]]
name = "cintx-rs"
expression = "MIT"
license-files = []

[[licenses.clarify]]
name = "cintx-runtime"
expression = "MIT"
license-files = []

[[licenses.clarify]]
name = "xcfun-core"
expression = "MPL-2.0"
license-files = []

[bans]
multiple-versions = "warn"
# Path-dep workspace members (cintx-*/xcfun-* and the pyscf-* crates) reference
# each other with unversioned path deps — normal for a path-dep workspace and
# benign: they resolve locally, not from a registry, and there are ZERO registry
# `version = "*"` deps anywhere. cargo-deny's allow-wildcard-paths only exempts
# publish=false crates, and the external cintx/xcfun crates are public, so these
# path-dep wildcards cannot be exempted from pyscf_rs alone. Downgrade to `warn`
# (still surfaced, never CI-fatal). Registry-wildcard supply-chain risk remains
# covered by [sources] + the explicit `deny` list below. (Plan 01-08 FOUND-10.)
wildcards = "warn"
allow-wildcard-paths = true
deny = [
    # Static-only distribution per DIST-04/DIST-05; reject any system-link
    # vector.
    { name = "openssl-sys" },
    { name = "system-deps" },
]

[sources]
unknown-registry = "deny"
unknown-git      = "deny"
allow-registry   = ["https://github.com/rust-lang/crates.io-index"]
allow-git = [
    "https://github.com/BectorVoom/cintx",
    "https://github.com/BectorVoom/libxc_rs",
    "https://github.com/BectorVoom/xcfun_rs",
]
