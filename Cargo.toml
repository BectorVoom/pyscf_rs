[workspace]
members = [
    "crates/pyscf-rs",
    "crates/pyscf-core",
    "crates/pyscf-runtime",
    "crates/pyscf-algebra",
    "crates/pyscf-kernels",
    "crates/pyscf-gto",
    "crates/pyscf-scf",
    "crates/pyscf-dft",
    # Phase 5 addition (D-01): AO→MO transformation crate (CCSD-reusable). Workspace grows 19 → 20.
    "crates/pyscf-ao2mo",
    "crates/pyscf-mp2",
    "crates/pyscf-ccsd",
    "crates/pyscf-grad",
    "crates/pyscf-geomopt",
    "crates/pyscf-py",
    "crates/pyscf-oracle",
    "crates/pyscf-bench",
    # Phase 3 additions (D-06, D-08, D-10): chkfile primitives, generic Pulay
    # extrapolation, density-fitting integrals. Workspace grows 15 → 18.
    "crates/pyscf-chkfile",
    "crates/pyscf-diis",
    "crates/pyscf-df",
    # Phase 4 addition (D-05): Becke molecular grids crate. Workspace grows 18 → 19.
    "crates/pyscf-grids",
    "xtask",
    # v2.0 PBC milestone (D-PBC-*). Workspace grows 20 -> 39.
    "crates/pyscf-pbc-lib",
    "crates/pyscf-pbc-tools",
    "crates/pyscf-pbc-gto",
    "crates/pyscf-pbc-df",
    "crates/pyscf-pbc-scf",
    "crates/pyscf-pbc-dft",
    "crates/pyscf-pbc-ao2mo",
    "crates/pyscf-pbc-mp",
    "crates/pyscf-pbc-cc",
    "crates/pyscf-pbc-ci",
    "crates/pyscf-pbc-symm",
    "crates/pyscf-pbc-grad",
    "crates/pyscf-pbc-geomopt",
    "crates/pyscf-pbc-tdscf",
    "crates/pyscf-pbc-gw",
    "crates/pyscf-pbc-adc",
    "crates/pyscf-pbc-x2c",
    "crates/pyscf-pbc-eph",
    "crates/pyscf-pbc-mpi",
]
exclude = []
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.92"
license = "Apache-2.0"
repository = "https://github.com/BectorVoom/pyscf_rs"
authors = ["pyscf-rs contributors"]

[workspace.dependencies]
# Cubecl pivot — all eight must move in lockstep (FOUND-04, D-13). Per
# RESEARCH §"Standard Stack" verified 2026-05-10.
cubecl          = { version = "=0.10.0" }
cubecl-runtime  = { version = "=0.10.0" }
cubecl-cpu      = { version = "=0.10.0" }
cubecl-cuda     = { version = "=0.10.0" }
cubecl-wgpu     = { version = "=0.10.0" }
cubecl-hip      = { version = "=0.10.0" }
# Version skew: cubecl-matmul / cubecl-reduce 0.10.0 unpublished as of
# 2026-05-10 (RESEARCH Pitfall 1). Pinned at the 0.9.0-pre.5 ABI; build-
# verification test in Plan 04 confirms compatibility with cubecl-runtime
# 0.10.0 before any GEMM call site lands.
cubecl-matmul   = { version = "=0.9.0-pre.5" }
cubecl-reduce   = { version = "=0.9.0-pre.5" }
# Adapter feature inspection. Pinned by cubecl-wgpu transitively.
wgpu            = "29.0.3"
# Host eigh/Cholesky/QR/SVD per ALG-05.
faer            = "0.24.0"
# Logging — FOUND-09 + ALG-08.
tracing         = "=0.1.44"
tracing-subscriber = { version = "=0.3.23", features = ["fmt"] }
# Common utility deps.
bytemuck        = { version = "1", features = ["derive"] }
# Host-side numeric abstraction for the precision-generic `Scalar` trait
# (quick-260522-b06). Small, fast-compiling; does NOT pull cubecl/libxc.
num-traits      = "0.2"
# Phase 9 plan 09-08 — `libm::erfc`, the FDLIBM double-precision complementary
# error function. `std` has no erfc and the Abramowitz-Stegun 7.1.26 rational
# form tops out near 1.5e-7 absolute, two orders too coarse for the 1e-9 Ha
# Ewald acceptance gate. No-std, no transitive deps, already in Cargo.lock.
libm            = "0.2"
cube-math       = { path = "../cube-math" }
thiserror       = "=2.0.18"
serde           = { version = "=1.0", features = ["derive"] }
serde_json      = "=1.0.149"
anyhow          = "=1.0.102"
# Phase 3 — HDF5 chkfile (D-05/D-06). Static feature → satisfies DIST-05 (no system libhdf5).
hdf5-metno      = { version = "=0.12.4", features = ["static"] }
# Phase 3 — needed by pyscf-chkfile and pyscf-df for typed array buffers; pyscf-core stays algebra-free.
ndarray         = "0.17"
# Phase 3 — needed by pyscf-py (Phase 3 plan 07). Declared at workspace level for consistency.
pyo3            = { version = "=0.28.3" }
numpy           = { version = "=0.28.0" }
# Test utilities.
approx          = "=0.5.1"
rstest          = "=0.26.1"

# FOUND-07: panic=abort on shipped artifacts.
# Dependency build profile. `"*"` covers every NON-workspace dependency and
# leaves this workspace's own crates on cargo's defaults.
#
# This exists because of the libxc kernel tree. `libxc_rs` sets `debug = 0` in
# its own `[profile.dev]` for its 156 generated kernel crates (some 16 MB of
# straight-line f64 source), but a dependency is built under the CONSUMER's
# profile, not its own — so under cargo's default `debug = 2` those crates make
# rustc exhaust memory and die: `error: rustc interrupted by SIGSEGV` on
# `libxc-rkernel-gga_x_ityh_pbe`, `mgga_k_csk_loc`, `gga_c_scan_e0`,
# `gga_x_sfat` and others. Debug info for third-party dependencies is not
# something this workspace debugs through, so dropping it costs nothing and
# also speeds up every other dependency build.
[profile.dev.package."*"]
debug = 0

[profile.release]
panic = "abort"
lto = "thin"
codegen-units = 16
strip = "symbols"

# FOUND-05 + Claude's-discretion §5 + §6: oracle profile is FMA-free.
# rustflags live in .cargo/config.toml (Cargo profiles cannot carry
# rustflags directly — RESEARCH Pitfall 2).
[profile.release-oracle]
inherits = "release"
panic = "abort"
lto = "off"
codegen-units = 1
opt-level = 3
debug = 1

# Sibling-crate sourcing — D-12 + D-13.
# Phase 1 ships current default-branch HEAD SHAs. ORACLE-05 nightly CI
# (Plan 06) bumps these via `cargo update -p cintx -p libxc_rs -p xcfun_rs`.
#
# All three sibling crates are temporarily switched to local path deps to
# (a) skip the heavy from-source builds (libcint/libxc/xcfun) inside the
# Plan 1 inner loop, and (b) sidestep the phantom .claude/worktrees/agent-*
# 160000-mode gitlinks present on cintx main and xcfun_rs master that block
# `cargo generate-lockfile` against the git remotes. Restore to git pins
# once upstream main/master is cleaned (see Plan 01-08 for the deferred
# upstream-fix path) and Phase 2/3 needs CI parity.
[patch.crates-io]
cintx     = { path = "../cintx" }
# Re-enabled behind the `libxc` feature (Phase 4 plan 04-10, Pitfall 5). This
# entry is INERT in the default build: the only consumer is `pyscf-dft`'s
# `libxc_rs = { ..., optional = true }` dep, gated by the off-by-default
# `libxc` feature (crates/pyscf-dft/Cargo.toml). Nothing in the default dep
# graph names libxc_rs, so `cargo build --workspace` (default) compiles ZERO
# `libxc-kernel-*` crates — PROVEN by `cargo tree -p pyscf-dft` (0 libxc_rs)
# in CI. The ~6h/266-kernel libxc compile runs ONLY in the dedicated cached
# `dft-libxc-bitexact` CI job (`--features libxc`), which itself stays DISABLED
# (workflow_dispatch / if:false) until 04-02's PENDING_LIBXC_RS_FEATURE_GATE
# lands the per-functional feature gate. NEVER run a default `cargo build` that
# names libxc_rs locally.
libxc_rs  = { path = "../libxc_rs" }
xcfun_rs  = { path = "../xcfun_rs/crates/xcfun-rs", package = "xcfun-rs" }
