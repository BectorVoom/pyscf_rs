[package]
name = "xtask"
version.workspace      = true
edition.workspace      = true
rust-version.workspace = true
license.workspace      = true
publish = false
default-run = "xtask"
description = "Internal build/lint automation for pyscf-rs (not published)"

[lib]
path = "src/lib.rs"

[[bin]]
name = "xtask"
path = "src/main.rs"

[[bin]]
name = "check-no-fma"
path = "src/bin/check_no_fma.rs"

[[bin]]
name = "check-forbidden-paths"
path = "src/bin/check_forbidden_paths.rs"

[[bin]]
name = "check-catch-unwind"
path = "src/bin/check_catch_unwind.rs"

[[bin]]
name = "check-dependency-wall"
path = "src/bin/check_dependency_wall.rs"

[[bin]]
name = "check-cubecl-pin"
path = "src/bin/check_cubecl_pin.rs"

# BIND-06 (Phase 3) — forbid `lazy_static!` under crates/pyscf-py/ so the
# free-threaded interpreter's no-GIL path never hits `std::sync::Once`.
# Plan 03-07 satisfies the lint by using `pyo3::sync::PyOnceLock` for caches.
[[bin]]
name = "check-forbid-lazy-static"
path = "src/bin/check_forbid_lazy_static.rs"

[[bin]]
name = "check-orphan-modules"
path = "src/bin/check_orphan_modules.rs"

# GRAD-10 workspace extension (19-02 Task 3): exactly one CPHF `pub fn solve`
# may exist in crates/*/src — `pyscf-grad/src/cphf.rs::solve`. Phase 19
# supplies k-aware `fvind`s and reuses that solver; a second solver fails this.
[[bin]]
name = "check-single-cphf"
path = "src/bin/check_single_cphf.rs"

[dependencies]
anyhow         = { workspace = true }
serde          = { workspace = true }
serde_json     = { workspace = true }
walkdir        = "2"
rustc-demangle = "0.1"

[dev-dependencies]
tempfile       = "3"
