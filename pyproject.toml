# pyscf-rs maturin packaging — Phase 3 BIND-01/BIND-02.
#
# This file REPLACES the upstream PySCF setuptools/cmake pyproject.toml. The
# upstream Python tree under `pyscf/` is preserved on disk (Phase 1 D-03 forbids
# touching it) but is no longer the active install target. From Phase 3 onward
# the active import surface is the `python/pyscf/` overlay, which re-exports the
# Rust `_native` cdylib built by `maturin develop` per BIND-02.
#
# Source-of-truth: .planning/phases/03-scf-pyo3-bindings/03-RESEARCH.md §"Pattern 10"
# (verbatim) + §"Recommended Project Structure".

[build-system]
requires = ["maturin>=1.4,<2.0"]
build-backend = "maturin"

[project]
name = "pyscf-rs"
version = "0.1.0"
description = "Pure-Rust rewrite of PySCF with drop-in pyscf.* import surface"
requires-python = ">=3.10"
authors = [{ name = "pyscf-rs contributors" }]
license = { text = "Apache-2.0" }
dependencies = ["numpy>=1.26"]

[project.optional-dependencies]
test = ["pytest>=7.0", "h5py>=3.10"]

[tool.maturin]
python-source = "python"
module-name   = "pyscf._native"
features      = ["pyo3/extension-module", "pyo3/abi3-py310"]
manifest-path = "crates/pyscf-py/Cargo.toml"
strip         = true
