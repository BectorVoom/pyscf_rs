[package]
name = "pyscf-gto"
version.workspace      = true
edition.workspace      = true
rust-version.workspace = true
license.workspace      = true
description = "Molecular structure & integrals via cintx. Implemented in Phase 2."

[lib]
path = "src/lib.rs"

[dependencies]
# Phase 2 D-03: pyscf-gto re-uses cintx-{core,compat,rs} for the integral seam.
# Path deps point at the sibling cintx workspace; the workspace [patch.crates-io]
# entry for cintx (root Cargo.toml:93) keeps any transitive cintx publish
# redirected to the same checkout. No `cubecl-*` here — algebra wall (Phase 1
# ALG-06) forbids method crates from importing cubecl directly.
cintx-core    = { path = "../../../cintx/crates/cintx-core" }
cintx-compat  = { path = "../../../cintx/crates/cintx-compat" }
cintx-rs      = { path = "../../../cintx/crates/cintx-rs" }
cintx-ops     = { path = "../../../cintx/crates/cintx-ops" }
cintx-runtime = { path = "../../../cintx/crates/cintx-runtime" }
pyscf-core    = { path = "../pyscf-core" }
pyscf-algebra = { path = "../pyscf-algebra" }
# Plan 02-06 GTO-07: eval_gto user wrapper dispatches into pyscf-kernels
# via pyscf-algebra. pyscf-gto consumes pyscf-kernels' AlgebraClient-typed
# public surface only (no cubecl-* import here — ALG-06 algebra wall).
pyscf-kernels = { path = "../pyscf-kernels" }
# Plan 02-04: gto_norm + _nomalize_contracted_ao need Γ(x) — libm::tgamma.
# libm is already transitively in the dep graph via faer; declared explicitly
# here so the `make_env` normalisation path doesn't depend on a transitive dep.
libm          = "0.2"
thiserror     = { workspace = true }
tracing       = { workspace = true }
serde         = { workspace = true, features = ["derive"] }
serde_json    = { workspace = true }

[dev-dependencies]
approx        = { workspace = true }
rstest        = { workspace = true }

[features]
default = []
# Plan 02-09 GTO-12: gates the dump_*_for_oracle.rs integration tests
# invoked by the pytest harness in tests/oracle/. Each helper is also
# marked #[ignore], so even with the feature on `cargo test --workspace`
# never runs them — the python harness invokes
# `cargo test --features release-oracle-tests -- --ignored` explicitly.
release-oracle-tests = []
