[package]
name = "pyscf-pbc-geomopt"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "cell + geometry optimization"

[dependencies]
pyscf-core       = { path = "../pyscf-core" }
pyscf-algebra    = { path = "../pyscf-algebra" }
pyscf-geomopt    = { path = "../pyscf-geomopt" }
pyscf-pbc-lib    = { path = "../pyscf-pbc-lib" }
pyscf-pbc-tools  = { path = "../pyscf-pbc-tools" }
pyscf-pbc-gto    = { path = "../pyscf-pbc-gto" }
pyscf-pbc-df     = { path = "../pyscf-pbc-df" }
pyscf-pbc-scf    = { path = "../pyscf-pbc-scf" }
pyscf-pbc-grad   = { path = "../pyscf-pbc-grad" }
thiserror        = { workspace = true }
tracing          = { workspace = true }

[dev-dependencies]
pyscf-pbc-gto = { path = "../pyscf-pbc-gto", features = ["test-systems"] }
pyscf-gto = { path = "../pyscf-gto" }
pyscf-core = { path = "../pyscf-core" }
pyscf-pbc-df = { path = "../pyscf-pbc-df" }
pyscf-pbc-scf = { path = "../pyscf-pbc-scf" }
