[package]
name = "pyscf-bench"
version.workspace      = true
edition.workspace      = true
rust-version.workspace = true
license.workspace      = true
description = "Performance benchmark suite for PySCF-RS and CubeCL GPU ROCm kernels."

[lib]
path = "src/lib.rs"

[[bin]]
name = "bench_rocm"
path = "src/main.rs"

[features]
default = ["cpu", "rocm"]
cpu = ["pyscf-algebra/cpu", "pyscf-kernels/cpu", "dep:cubecl-cpu"]
rocm = ["pyscf-algebra/rocm", "pyscf-kernels/rocm", "dep:cubecl-hip"]

[dependencies]
pyscf-core       = { path = "../pyscf-core" }
pyscf-algebra    = { path = "../pyscf-algebra", default-features = false }
# W-03/W-06 decision benchmark: the host side of the comparison is the rayon
# route the production code actually takes, not a serial straw man.
rayon            = { workspace = true }
pyscf-kernels    = { path = "../pyscf-kernels", default-features = false }
pyscf-gto        = { path = "../pyscf-gto" }
pyscf-scf        = { path = "../pyscf-scf" }
pyscf-mp2        = { path = "../pyscf-mp2" }
pyscf-ccsd       = { path = "../pyscf-ccsd" }
pyscf-df         = { path = "../pyscf-df" }
# W-00 (KRKS-OPTIMISATION-PLAN.md): the krks_profile baseline harness.
pyscf-pbc-gto    = { path = "../pyscf-pbc-gto" }
pyscf-pbc-tools  = { path = "../pyscf-pbc-tools" }
pyscf-pbc-df     = { path = "../pyscf-pbc-df" }
pyscf-pbc-dft    = { path = "../pyscf-pbc-dft" }
pyscf-pbc-scf    = { path = "../pyscf-pbc-scf" }
# S-00 (KUKS-KSYMM-MULTIGRID-OPTIMISATION-PLAN.md): the `ksymm` profiling
# mode needs `make_kpts`/`KPoints` to build an irreducible k-set. Not a
# cubecl crate, so ALG-06 is untouched; `pyscf-pbc-dft` already pulls it in.
pyscf-pbc-symm   = { path = "../pyscf-pbc-symm" }
serde            = { workspace = true }
serde_json       = { workspace = true }
tracing          = { workspace = true }
tracing-subscriber = { workspace = true }
cubecl        = { workspace = true }
cubecl-cpu    = { workspace = true, optional = true }
cubecl-hip    = { workspace = true, optional = true }
