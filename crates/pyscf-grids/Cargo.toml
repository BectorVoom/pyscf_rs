[package]
name = "pyscf-grids"
version.workspace      = true
edition.workspace      = true
rust-version.workspace = true
license.workspace      = true
description = "Becke molecular grids (gen_grid/radi/Lebedev port). Phase 4 (D-05)."

[lib]
path = "src/lib.rs"

# Algebra wall (Pitfall 2 / ALG-06): grids depends ONLY on pyscf-core +
# pyscf-algebra for compute; no direct cubecl-* dep. All array work routes
# through pyscf-algebra's public Tensor surface.
[dependencies]
pyscf-core    = { path = "../pyscf-core" }
pyscf-algebra = { path = "../pyscf-algebra" }
thiserror     = { workspace = true }
tracing       = { workspace = true }
