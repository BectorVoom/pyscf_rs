[package]
name = "pyscf-dft"
version.workspace      = true
edition.workspace      = true
rust-version.workspace = true
license.workspace      = true
description = "Density functional theory (RKS/UKS + Becke grids). Implemented in Phase 4."

[lib]
path = "src/lib.rs"

# libxc is the DEFAULT XC backend, matching upstream PySCF (`dft/numint.py:27-34`
# imports libxc first and falls back to xcfun only on ImportError).
#
# This matters for accuracy, not taste: the two libraries are independent
# implementations of the same functional forms, and carried through an SCF they
# differ by 4.7e-7 Ha on PBE/Si. While this port defaulted to xcfun, every
# comparison against a default-configured upstream measured that gap instead of
# this port's fidelity.
#
# `libxc_rs` now evaluates the full corpus and agrees with C libxc 7.0.0 to
# <= 2.14e-16 (under 1 ulp; several quantities bit-identical) — so the switch
# should ELIMINATE that gap rather than shrink it. It was blocked until
# 2026-08-28 by three defects in libxc_rs (a facade that could not reach the
# kernels, a 1-of-649 params stub, and a partial dispatch table); all are fixed.
# See `docs/PLAN-defect-remediation-v{1..5}.md` in the libxc_rs tree.
#
# Still a feature, so `--no-default-features` gives a libxc-free build that
# falls back to xcfun — see `XcBackend`'s `Default` impl.
#
# Build cost: a cold release build of the libxc kernel tree is >40 min; debug is
# minutes, and an incremental `cargo check -p pyscf-dft` is ~18 s. (An older
# note here claimed "266 kernel crates, ~6h freeze"; that was never measured and
# is wrong.)
[features]
default = ["libxc"]
libxc   = ["dep:libxc_rs"]
# CI-only: turn on the live PySCF oracle harness for the DFT-01
# rks_uks_bitexact energy assertions. Forwards to pyscf-oracle's `python`
# feature (libpython + an importable upstream pyscf). Off by default so the
# local `cargo test -p pyscf-dft` build stays freestanding — mirrors the
# 04-04 pyscf-grids `python` passthrough. Does NOT add a runtime dep (the
# oracle is a dev-dependency only — ORACLE-01 / PyO3 wall intact for the lib).
python  = ["pyscf-oracle/python"]

[dependencies]
# Method-crate deps (path). pyscf-runtime (DType::from_env, D-08) and
# pyscf-algebra (the DeviceScalar matmul element bound, D-08) are the precision
# seam D-08 reuses — D-08 adds NO new dependency.
pyscf-core    = { path = "../pyscf-core" }
pyscf-algebra = { path = "../pyscf-algebra" }
pyscf-gto     = { path = "../pyscf-gto" }
pyscf-scf     = { path = "../pyscf-scf" }
pyscf-df      = { path = "../pyscf-df" }
pyscf-grids   = { path = "../pyscf-grids" }
pyscf-chkfile = { path = "../pyscf-chkfile" }
pyscf-runtime = { path = "../pyscf-runtime" }
# Plan 04-08 — the KS chkfile F-order mo_coeff view (chkfile.rs builds an
# ArrayView2 with explicit F-strides for write_dataset_f_order, Pitfall 8).
# Mirrors pyscf-scf::chkfile's ndarray use; NOT an hdf5 dep (D-05 intact —
# pyscf-chkfile remains the sole owner of hdf5-metno; ndarray is the array
# view crate the chkfile primitives already take as input).
ndarray       = { workspace = true }
# Default XC backend: native-Rust xcfun (always compiled). Redirected to the
# sibling path via the workspace [patch.crates-io] xcfun_rs entry.
xcfun-rs      = "0.1.0"
# DFT-11 WGPU f64-honesty delegation target. `xcfun-gpu` is ALREADY in the
# default dep graph transitively (xcfun-rs → xcfun-gpu); this direct entry only
# makes `auto_backend` / `error_routing::must_fall_back_to_cpu` / `Backend`
# nameable at the `xc_backend.rs` XC-eval seam so the WGPU shader-f64 probe is
# DELEGATED, never re-implemented (DFT-11, Pitfall 6). `default-features = false`
# adds NO cubecl features beyond what xcfun-rs's default `cpu` already pulls;
# the two functions used (`auto_backend`, `must_fall_back_to_cpu`) are pure /
# cfg-gated and never compile a GPU runtime in the CPU-only default build. NOT
# a cubecl-* crate, so the ALG-06 dependency-wall lint (FORBIDDEN_DEPS) permits
# it; cubecl containment is unchanged (no new direct cubecl-* dep).
xcfun-gpu     = { path = "../../../xcfun_rs/crates/xcfun-gpu", default-features = false }
tracing       = { workspace = true }
thiserror     = { workspace = true }
# The libxc backend, ON by default (see [features] above). Still optional so
# `--no-default-features` drops it entirely.
libxc_rs      = { path = "../../../libxc_rs", optional = true }

# NO pyo3 dep here (PyO3 wall) — the Python surface lives in pyscf-py.

[dev-dependencies]
# Plan 04-06 — DFT-01 RKS/UKS energy oracle. The live-PySCF harness is a
# DEV dependency only (ORACLE-01: release wheels never link Python); the
# `rks_energy`/`uks_energy` arms run only under `--features python` on CI
# with libpython + an importable upstream pyscf. The default `cargo test`
# build does NOT pull pyo3 (the harness short-circuits to
# PythonFeatureNotEnabled). pyscf-gto is needed by the structural test layer
# to build Mole fixtures.
pyscf-oracle  = { path = "../pyscf-oracle" }
pyscf-gto     = { path = "../pyscf-gto" }
tracing-subscriber = { workspace = true }
# Plan 04-08 — KS chkfile round-trip scratch paths (ks_chkfile_roundtrip.rs +
# the chkfile.rs inline tests). Mirrors pyscf-scf's `tempfile = "3"` dev-dep
# for the SCF chkfile tests. NO new runtime dep (D-05: pyscf-chkfile remains
# the sole owner of hdf5-metno; pyscf-dft does NOT add an hdf5-metno dep).
tempfile      = "3"
