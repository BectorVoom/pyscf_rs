[package]
name = "pyscf-kernels"
version.workspace      = true
edition.workspace      = true
rust-version.workspace = true
license.workspace      = true
description = "Numerical kernels (eval_gto, DFT XC). Phase 2 D-04 wires eval_gto here."

[lib]
path = "src/lib.rs"

# Phase 2 D-04 + Phase 1 D-12 carry-forward: cubecl 0.10.0 lockstep, per-backend
# features. `cpu` default-on (matches pyscf-algebra precedent). Method crates
# (pyscf-gto, pyscf-scf, …) MUST NOT depend on cubecl-* directly — that's the
# algebra wall (ALG-06). pyscf-kernels is on the carve-out allowlist alongside
# pyscf-algebra and pyscf-runtime; see xtask/check_dependency_wall.rs.
[features]
default = ["cpu"]
cpu     = ["cubecl/cpu", "dep:cubecl-cpu"]
cuda    = ["dep:cubecl-cuda"]
wgpu    = ["dep:cubecl-wgpu"]
rocm    = ["dep:cubecl-hip"]
# `metal` aliases `wgpu` (cubecl-metal not on crates.io) per cintx-cubecl
# precedent (Phase 1 D-12 carry-forward).
metal   = ["wgpu"]

[dependencies]
pyscf-core    = { path = "../pyscf-core" }
pyscf-algebra = { path = "../pyscf-algebra", default-features = false }
# Plan 02-06 D-04: eval_gto matches on `BackendKind` to dispatch CPU vs GPU
# (Phase 8 wires the GPU arms; Phase 2 ships CPU only with a tracing::warn
# fallback for unwired backends).
pyscf-runtime = { path = "../pyscf-runtime" }
cubecl         = { workspace = true }
cubecl-runtime = { workspace = true }
cubecl-cpu     = { workspace = true, optional = true }
cubecl-cuda    = { workspace = true, optional = true }
cubecl-wgpu    = { workspace = true, optional = true }
cubecl-hip     = { workspace = true, optional = true }
bytemuck       = { workspace = true }
tracing        = { workspace = true }
thiserror      = { workspace = true }

[dev-dependencies]
approx = { workspace = true }
