[package]
name = "pyscf-core"
version.workspace      = true
edition.workspace      = true
rust-version.workspace = true
license.workspace      = true
description = "Universal types (Mole, Density, Energy) and method traits for pyscf-rs (no compute deps per FOUND-02)"

[lib]
path = "src/lib.rs"

# FOUND-02: NO compute (cubecl-*) dependencies. Phase 2 D-03 adds cintx-core
# and cintx-compat — neither is a cubecl-* runtime crate, so the algebra wall
# (ALG-06, enforced by `xtask check-dependency-wall`) still holds. cintx-core
# owns the typed BasisSet that pyscf-core re-exports zero-copy per GTO-11;
# cintx-compat owns the libcint slot constants (ATM_SLOTS, BAS_SLOTS,
# PTR_ENV_START, etc.) that the make_env projection (plan 02-04) reuses
# instead of duplicating libcint layout knowledge.
[dependencies]
cintx-core    = { path = "../../../cintx/crates/cintx-core" }
cintx-compat  = { path = "../../../cintx/crates/cintx-compat" }
thiserror     = { workspace = true }
# `derive` feature inherited from workspace; pyscf-gto plan 02-08 (GTO-09)
# uses Serialize/Deserialize derives on ParsedBasis / ShellSpec / ParsedEcp /
# EcpShell so that `pyscf_gto::dumps()` / `loads()` can round-trip _basis
# and _ecp via serde_json without a hand-rolled mirror type.
serde         = { workspace = true, features = ["derive"] }
tracing       = { workspace = true }
# quick-260522-b06: host-only `Scalar` precision generic. `num-traits` gives
# the `Float` host bound; `bytemuck::Pod` is needed for byte-level buffer
# typing. Neither pulls cubecl — the algebra-wall (ALG-06) stays intact.
num-traits    = { workspace = true }
bytemuck      = { workspace = true }
