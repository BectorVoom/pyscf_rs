[package]
name = "pyscf-pbc-cc"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "KCCSD RHF/UHF/GHF, (T), EOM"

[dependencies]
pyscf-core       = { path = "../pyscf-core" }
pyscf-algebra    = { path = "../pyscf-algebra" }
# Plan 16-02: the complex tensor arena (`ZWorkspacePool`) lives in
# pyscf-runtime, exactly as the f64 `WorkspacePool` pyscf-ccsd consumes does.
pyscf-runtime    = { path = "../pyscf-runtime" }
pyscf-ccsd       = { path = "../pyscf-ccsd" }
pyscf-pbc-lib    = { path = "../pyscf-pbc-lib" }
pyscf-pbc-tools  = { path = "../pyscf-pbc-tools" }
pyscf-pbc-gto    = { path = "../pyscf-pbc-gto" }
pyscf-pbc-df     = { path = "../pyscf-pbc-df" }
pyscf-pbc-scf    = { path = "../pyscf-pbc-scf" }
pyscf-pbc-ao2mo  = { path = "../pyscf-pbc-ao2mo" }
pyscf-pbc-mp     = { path = "../pyscf-pbc-mp" }
# 17-09 (the CC half): `kccsd_rhf_ksymm.py` is written against `KPoints`,
# `KQuartets`, `MORotationMatrix` and `KsymmArray` — all of which 17-02/05/06
# shipped in `pyscf-pbc-symm`. D-PBC-15 forbids `pyscf-pbc-df` from naming these
# types; it says nothing about the post-SCF crates.
pyscf-pbc-symm   = { path = "../pyscf-pbc-symm" }
# `KsymmArray` speaks `Vec<Complex64>`; this crate speaks planar `CTensor`.
# The seam lives in `ksymm_common` alone.
num-complex      = "0.4.6"
# The Phase-3 CDIIS ring buffer, reused for the amplitude iteration exactly as
# pyscf-ccsd reuses it for the molecular one (no new DIIS body).
pyscf-diis       = { path = "../pyscf-diis" }
thiserror        = { workspace = true }
tracing          = { workspace = true }
# D-PBC-29 clause 2: every Phase-16 contraction is a host rayon loop over
# k-point triples with `oracle_*` accumulators, not `zgemm_dense`.
rayon            = { workspace = true }

[dev-dependencies]
pyscf-gto = { path = "../pyscf-gto" }
# 17-09 §9.3: the 1-vs-8-thread bit-identity gate varies the worker count
# inside ONE process with an explicit `rayon::ThreadPool`.
rayon = { workspace = true }
