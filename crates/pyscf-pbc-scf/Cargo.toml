[package]
name = "pyscf-pbc-scf"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "SCF (gamma) + KSCF/KRHF/KUHF/KROHF/KGHF, smearing, addons, stability, newton"

[dependencies]
pyscf-core      = { path = "../pyscf-core" }
pyscf-algebra   = { path = "../pyscf-algebra" }
pyscf-scf       = { path = "../pyscf-scf" }
pyscf-pbc-lib   = { path = "../pyscf-pbc-lib" }
pyscf-pbc-tools = { path = "../pyscf-pbc-tools" }
pyscf-pbc-gto   = { path = "../pyscf-pbc-gto" }
pyscf-pbc-df    = { path = "../pyscf-pbc-df" }
# Plan 17-07 — the ksymm SCF adapters. D-PBC-25 verified this acyclic:
# `pyscf-pbc-symm -> {core, algebra, pbc-lib, pbc-tools, pbc-gto}` only, so it
# sits strictly below `pyscf-pbc-scf`.
pyscf-pbc-symm  = { path = "../pyscf-pbc-symm" }
pyscf-diis      = { path = "../pyscf-diis" }
# 19-03 (GRAD-10): the single matrix-free Krylov CPHF solver. `cphf.rs` builds
# k-aware `fvind`s and reuses `pyscf_grad::cphf::solve` — it defines no solver
# of its own (`check-single-cphf` enforces this workspace-wide).
pyscf-grad      = { path = "../pyscf-grad" }
libm            = { workspace = true }
num-complex     = "0.4.6"
pyscf-chkfile   = { path = "../pyscf-chkfile" }
ndarray         = { workspace = true }
thiserror       = { workspace = true }
tracing         = { workspace = true }

[dev-dependencies]
pyscf-gto        = { path = "../pyscf-gto" }
pyscf-pbc-gto   = { path = "../pyscf-pbc-gto", features = ["test-systems"] }
serde_json      = { workspace = true }
# 19-03 §9.3 precedent (17-09): the 1-vs-8-thread bit-identity gate varies the
# worker count inside ONE process with an explicit `rayon::ThreadPool`.
rayon           = { workspace = true }
