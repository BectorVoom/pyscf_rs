[package]
name = "pyscf-grad"
version.workspace      = true
edition.workspace      = true
rust-version.workspace = true
license.workspace      = true
description = "Analytical gradients (HF/DFT/MP2/CCSD). Implemented in Phase 7."

[lib]
path = "src/lib.rs"

[dependencies]
# Full workspace-internal dep set (07-PATTERNS.md §Cargo.toml, 07-RESEARCH.md
# §Standard Stack). Internal crates are referenced via `{ path = "../..." }`
# (the proven sibling idiom, mirroring pyscf-ccsd/Cargo.toml) — they are NOT
# registered as `[workspace.dependencies]`, so a `{ workspace = true }` form
# would not resolve.
#
# NO pyo3 (D-07/D-08 — the bridge lives exclusively in pyscf-py).
# NO cubecl-* (algebra wall — denylist auto-enforced by xtask
#   check_dependency_wall; only pyscf-algebra/pyscf-runtime may name cubecl).
# NO hdf5-metno (D-07 — the HDF5 spill goes through pyscf-chkfile's re-exported
#   `hdf5` alias; pyscf-chkfile is the sole hdf5 owner).
#
# Beyond the CCSD path-dep block, grad ADDS pyscf-grids + pyscf-dft (the
# numint + Becke-weight seam the KS-gradient (rks/uks) consumes; libxc stays
# feature-gated OFF in pyscf-dft, so pulling it in does NOT compile libxc_rs).
pyscf-core    = { path = "../pyscf-core" }
pyscf-algebra = { path = "../pyscf-algebra" }
pyscf-ao2mo   = { path = "../pyscf-ao2mo" }
pyscf-scf     = { path = "../pyscf-scf" }
pyscf-mp2     = { path = "../pyscf-mp2" }
pyscf-ccsd    = { path = "../pyscf-ccsd" }
pyscf-df      = { path = "../pyscf-df" }
pyscf-grids   = { path = "../pyscf-grids" }
pyscf-dft     = { path = "../pyscf-dft" }
pyscf-gto     = { path = "../pyscf-gto" }
pyscf-chkfile = { path = "../pyscf-chkfile" }
pyscf-runtime = { path = "../pyscf-runtime" }
thiserror     = { workspace = true }
tracing       = { workspace = true }

[dev-dependencies]
approx = "0.5"
