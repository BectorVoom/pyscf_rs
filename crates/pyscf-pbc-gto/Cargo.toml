[package]
name = "pyscf-pbc-gto"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "Cell, Gv, SI, ewald, GTH pseudo, pbc_intor, eval_gto periodic, neighborlist"

[dependencies]
# Host-side libm. `rmath` is the crate `cube-math` was ported from — same
# algorithms, bit-identical to the platform libm, and NO cubecl dependency, so
# it sits on the method-crate side of the ALG-06 wall. Needed for `erf`, which
# `std` does not provide. See the note in `exxdiv_vcut.rs`.
rmath = { path = "../../../rmath" }
# `radial::gauss_chebyshev` for the `inf_vacuum` non-uniform Gv base
# (`cell.py:607-613` uses the same `dft.radi.gauss_chebyshev` the molecular
# Becke grids do) — one radial rule, not a second copy.
pyscf-grids = { path = "../pyscf-grids" }
pyscf-core      = { path = "../pyscf-core" }
pyscf-algebra   = { path = "../pyscf-algebra" }
pyscf-gto       = { path = "../pyscf-gto" }
# Phase 9 plan 09-05 — K-01 `gv` / K-02 `struct_factor` device kernels. RULE 6:
# a pyscf-pbc-* crate consumes `pyscf_algebra::*` and `pyscf_kernels::*` only;
# it never names `cubecl-*` itself (ALG-06, check_dependency_wall).
pyscf-kernels   = { path = "../pyscf-kernels" }
pyscf-pbc-lib   = { path = "../pyscf-pbc-lib" }
# Phase 10 plan 10-03 (D-PBC-07) — the periodic 1e driver evaluates molecular
# shell-pair blocks over an image-expanded `cintx_core::BasisSet`. Same seam
# `pyscf-gto` already uses (Phase 2 D-03); still NO `cubecl-*` here (ALG-06).
cintx-core      = { path = "../../../cintx/crates/cintx-core" }
cintx-ops       = { path = "../../../cintx/crates/cintx-ops" }
cintx-rs        = { path = "../../../cintx/crates/cintx-rs" }
cintx-runtime   = { path = "../../../cintx/crates/cintx-runtime" }
pyscf-pbc-tools = { path = "../pyscf-pbc-tools" }
# Plan 09-08 — `libm::erfc` for the real-space Ewald sum (see the workspace
# manifest for why std/A&S are not enough).
libm            = { workspace = true }
thiserror       = { workspace = true }
tracing         = { workspace = true }
serde           = { workspace = true, features = ["derive"] }
# `float_roundtrip`: serde_json's DEFAULT f64 parser is a fast path that can be
# off by 1 ULP, so `loads(dumps(cell))` would silently perturb the lattice in
# the last bit (caught by tests/cell_build.rs on the LiF lattice). This feature
# makes parsing exact, which a bit-reproducibility milestone requires.
serde_json      = { workspace = true, features = ["float_roundtrip"] }

# PBC-MASTER-PLAN §9.2 — the five shared reference systems live behind this
# feature so a production build never compiles them. Downstream PBC crates
# enable it from their `[dev-dependencies]`; this crate's own integration tests
# get it through the self dev-dependency below.
[features]
default = ["gth-pp"]
test-systems = []
# Phase 10 plans 10-05 / 10-06 (R-13) — GTH pseudopotentials need the
# moment-weighted cintx families `int1e_r{2,4}_origi` and
# `int3c1e_r{2,4,6}_origk`. cintx ships their kernels
# (`cintx-cubecl/src/kernels/unstable/{origi,origk}.rs`) behind
# `unstable-source-api`; without the flag `SessionRequest::evaluate` refuses
# with "source-only symbol ... requires feature `unstable-source-api`" — it does
# NOT fall open to the unweighted parent (the R-13 silent-wrong-answer risk),
# which `tests/cintx_moment_weighted_available.rs` re-checks on every run.
#
# DEFAULT-ON: every reference system in PBC-MASTER-PLAN §9.2 uses `gth-pade`,
# so a pyscf-pbc-gto without this flag cannot build an `hcore` for any of them.
# The manifest still marks these symbols `oracle_covered: false`, so their
# numeric gates compare against upstream PySCF rather than against cintx's own
# oracle.
gth-pp = ["cintx-rs/unstable-source-api"]

[dev-dependencies]
# Self dev-dependency: turns on `test-systems` for this crate's own integration
# tests without duplicating the system definitions into `tests/`.
pyscf-pbc-gto = { path = ".", features = ["test-systems"] }
cintx-core    = { path = "../../../cintx/crates/cintx-core" }
cintx-ops     = { path = "../../../cintx/crates/cintx-ops" }
cintx-rs      = { path = "../../../cintx/crates/cintx-rs" }
cintx-runtime = { path = "../../../cintx/crates/cintx-runtime" }
approx        = { workspace = true }
