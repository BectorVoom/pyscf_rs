[package]
name = "pyscf-pbc-tdscf"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "periodic TDA/TDHF/TDDFT"

[dependencies]
pyscf-core      = { path = "../pyscf-core" }
pyscf-algebra   = { path = "../pyscf-algebra" }
pyscf-pbc-lib   = { path = "../pyscf-pbc-lib" }
pyscf-pbc-tools = { path = "../pyscf-pbc-tools" }
pyscf-pbc-gto   = { path = "../pyscf-pbc-gto" }
pyscf-pbc-df    = { path = "../pyscf-pbc-df" }
pyscf-pbc-scf   = { path = "../pyscf-pbc-scf" }
# 19-02 libxc posture (19-CONTEXT §1.7): developer builds stay libxc-free;
# release builds pass `--features libxc`. Escalate only if a Gate-A number
# moves with the feature off.
pyscf-pbc-dft   = { path = "../pyscf-pbc-dft", default-features = false }
thiserror       = { workspace = true }
tracing         = { workspace = true }

[features]
libxc = ["pyscf-pbc-dft/libxc"]

[dev-dependencies]
serde_json      = { workspace = true }
# 19-06 determinism gate: 1-vs-8-thread bit-identity inside one process.
rayon           = { workspace = true }
