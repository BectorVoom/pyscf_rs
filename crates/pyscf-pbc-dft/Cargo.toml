[package]
name = "pyscf-pbc-dft"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "gen_grid, numint, KRKS/KUKS/KROKS/KGKS + gamma, DFT+U, multigrid, cdft"

[dependencies]
pyscf-core      = { path = "../pyscf-core" }
pyscf-algebra   = { path = "../pyscf-algebra" }
pyscf-dft       = { path = "../pyscf-dft" }
pyscf-gto       = { path = "../pyscf-gto" }
pyscf-grids     = { path = "../pyscf-grids" }
pyscf-pbc-lib   = { path = "../pyscf-pbc-lib" }
pyscf-pbc-tools = { path = "../pyscf-pbc-tools" }
pyscf-pbc-gto   = { path = "../pyscf-pbc-gto" }
pyscf-pbc-df    = { path = "../pyscf-pbc-df" }
pyscf-pbc-scf   = { path = "../pyscf-pbc-scf" }
thiserror       = { workspace = true }
# W-06 (`.planning/pbc/KRKS-OPTIMISATION-PLAN.md`): the `numint` grid
# contractions are parallelised over DISJOINT output rows. Each output cell's
# own summation order is untouched, so `oracle_sum`'s pairwise tree — and with
# it D-PBC-17's thread-count invariance — is preserved exactly.
rayon           = { workspace = true }
tracing         = { workspace = true }

[dev-dependencies]
pyscf-gto       = { path = "../pyscf-gto" }
pyscf-pbc-gto   = { path = "../pyscf-pbc-gto", features = ["test-systems"] }
serde_json      = { workspace = true }
pyscf-grids     = { path = "../pyscf-grids" }
