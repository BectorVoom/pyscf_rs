[package]
name = "pyscf-py"
version.workspace      = true
edition.workspace      = true
rust-version.workspace = true
license.workspace      = true
description = "PyO3 abi3-py310 wheel (BIND-01) + Python 3.13t non-abi3 build (BIND-05)"
# Checker iteration 1 WARNING 4 — feature-mutex guard. build.rs panics at
# compile time if both `abi3-py310` and `free-threading` are simultaneously
# enabled. Cargo features are not natively mutually exclusive; this is the
# standard workaround. See crates/pyscf-py/build.rs.
build = "build.rs"

[lib]
path = "src/lib.rs"
crate-type = ["cdylib", "rlib"]

# CRITICAL: abi3-py310 and free-threading are MUTUALLY EXCLUSIVE.
# build.rs panics at compile time if both are simultaneously enabled.
# Source: .planning/phases/03-scf-pyo3-bindings/03-RESEARCH.md
# §"CRITICAL abi3 vs free-threaded ABI conflict".
#
# default (abi3-py310): Linux/macOS/Windows × x86_64+aarch64 PR-CI smoke.
# free-threading:       separate non-abi3 build for python3.13t (BIND-05, plan 03-09).
[features]
default        = ["abi3-py310"]
abi3-py310     = ["pyo3/abi3-py310", "pyo3/extension-module"]
free-threading = ["pyo3/extension-module"]

[dependencies]
pyo3          = { workspace = true }
numpy         = { workspace = true }
pyscf-core    = { path = "../pyscf-core" }
pyscf-scf     = { path = "../pyscf-scf" }
pyscf-gto     = { path = "../pyscf-gto" }
pyscf-runtime = { path = "../pyscf-runtime" }
pyscf-chkfile = { path = "../pyscf-chkfile" }
pyscf-df      = { path = "../pyscf-df" }
ndarray       = { workspace = true }
thiserror     = { workspace = true }
