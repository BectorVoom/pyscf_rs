# Pre-merge CI for the pyscf-rs Rust workspace.
#
# This file replaces the upstream-PySCF Python `ci.yml` because pyscf-rs is a
# pure-Rust port (see Cargo.toml [workspace] root). Other upstream workflows
# (lint.yml, ci_conda.yml, publish.yml) are left untouched — they target the
# Python sources under pyscf/ which are kept only for reference until the
# Rust port reaches feature parity.
#
# Coverage: ROADMAP success criteria 1, 2, 3, 5, 6:
#   1. cargo build --workspace --locked (default + --features gpu)
#   2. xtask check-no-fma (release-oracle FMA grep, FOUND-05)
#   3. oracle-determinism × 2 (RAYON_NUM_THREADS=1 and =8)
#   5. four lints: clippy unwrap deny + check-forbidden-paths +
#      check-catch-unwind + check-dependency-wall (+ check-cubecl-pin)
#   6. select_backend env-var truth table (covered by cargo test)
name: CI

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:

env:
  # FOUND-05 + Pitfall 1: explicitly empty so no GitHub-Actions-default
  # fast-math sneaks in. The .cargo/config.toml [build] rustflags
  # supply -fp-contract=off + -target-feature=-fma,-fma4 (Plan 01).
  RUSTFLAGS: ""
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"

jobs:
  fmt:
    name: cargo fmt --check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-sibling-crates
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          components: rustfmt
      - run: git ls-files '*.rs' | xargs rustfmt --edition 2024 --check

  clippy:
    name: cargo clippy -D warnings (FOUND-07 unwrap deny)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-sibling-crates
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings

  build-default:
    name: cargo build --workspace (default features = cpu)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-sibling-crates
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --workspace --locked

  build-gpu:
    name: cargo build --workspace --features gpu (Pitfall 7 cuda+wgpu compile-only)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-sibling-crates
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@v2
      # cuda+wgpu probe arms compile even without GPU hardware (RESEARCH
      # Pitfall 7 — type-check the gpu-gated arms early so a Phase 4
      # mistake does not go unnoticed for weeks).
      - run: cargo build --workspace --locked --features gpu

  test:
    name: cargo test --workspace
    runs-on: ubuntu-latest
    needs: [build-default]
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-sibling-crates
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
      - name: Free runner disk space for workspace tests
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace --locked --jobs 1 --no-fail-fast -- --test-threads=1

  # ROADMAP success criterion 3 — Pitfall 2 SHOWSTOPPER mitigation.
  # Two jobs in matrix: rayon-1 vs rayon-8. Both run release-oracle
  # profile (FOUND-05 FMA-free) and the oracle_determinism integration
  # test (Plan 04). The bit-identical contract is asserted in-process
  # by the test — these CI jobs prove it survives across thread-count
  # configurations.
  oracle-determinism:
    name: oracle-determinism (RAYON_NUM_THREADS=${{ matrix.rayon }})
    runs-on: ubuntu-latest
    needs: [build-default]
    strategy:
      fail-fast: false
      matrix:
        rayon: ["1", "8"]
    env:
      RAYON_NUM_THREADS: ${{ matrix.rayon }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-sibling-crates
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --profile release-oracle -p pyscf-algebra --test oracle_determinism --locked -- --test-threads=1

  # FOUND-05: the FMA grep gate. Runs xtask check-no-fma which builds
  # pyscf-algebra + pyscf-core under release-oracle, scans the asm,
  # and fails on any FMA mnemonic.
  xtask-no-fma:
    name: xtask check-no-fma (FOUND-05 / Pitfall 1)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-sibling-crates
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo run --quiet -p xtask --bin check-no-fma

  # FOUND-08 / Pitfall 21: scope-creep gate.
  xtask-forbidden-paths:
    name: xtask check-forbidden-paths (FOUND-08 / Pitfall 21)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-sibling-crates
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo run --quiet -p xtask --bin check-forbidden-paths

  # FOUND-07 / Pitfall 14: catch_unwind on every extern "C" gate.
  xtask-catch-unwind:
    name: xtask check-catch-unwind (FOUND-07 / Pitfall 14)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-sibling-crates
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo run --quiet -p xtask --bin check-catch-unwind

  # ALG-06: cubecl-* containment gate.
  xtask-dependency-wall:
    name: xtask check-dependency-wall (ALG-06)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-sibling-crates
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo run --quiet -p xtask --bin check-dependency-wall

  # FOUND-04: cubecl 0.10.0 lockstep gate.
  xtask-cubecl-pin:
    name: xtask check-cubecl-pin (FOUND-04 / Pitfall 1)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-sibling-crates
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo run --quiet -p xtask --bin check-cubecl-pin

  # BIND-06: forbid lazy_static! in crates/pyscf-py (deadlocks under 3.13t).
  xtask-forbid-lazy-static:
    name: xtask check-forbid-lazy-static (BIND-06)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-sibling-crates
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo run --quiet -p xtask --bin check-forbid-lazy-static

  # FOUND-10: license + advisory + bans gating.
  cargo-deny:
    name: cargo deny check (FOUND-10)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-sibling-crates
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo install --locked cargo-deny@0.19.5
      - run: cargo deny check

  # ── Phase 3 plan 03-09 ─────────────────────────────────────────────
  # 4 new jobs per RESEARCH §Validation Architecture + VALIDATION.md §Wave 0.
  # See plan 03-09-PLAN.md for the contract each job validates.
  # Checker iteration 1: BLOCKER 2 + NIT 6 remediations applied (2026-05-11).

  maturin-smoke:
    name: maturin develop + pyscf._native importable (BIND-01)
    runs-on: ubuntu-latest
    needs: [build-default]
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-sibling-crates
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@v2
      - name: Install maturin (>=1.4 required for --profile flag)
        run: |
          python -m venv .venv
          .venv/bin/pip install "maturin>=1.4,<2.0" "numpy>=1.26" "scipy>=1.11" "h5py>=3.10"
      - name: Build + install pyscf-rs into venv
        run: .venv/bin/maturin develop --release
      - name: Verify _native module imports
        run: |
          cd python
          ../.venv/bin/python -c "from pyscf._native import scf; assert hasattr(scf,'RHF') and hasattr(scf,'UHF') and hasattr(scf,'GHF'); print('OK')"

  stride-fuzz:
    name: BIND-04 stride-fuzz (a/a.T/a[::2]/a[:,1:5] return identical)
    runs-on: ubuntu-latest
    needs: [maturin-smoke]
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-sibling-crates
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@v2
      - run: |
          python -m venv .venv
          .venv/bin/pip install "maturin>=1.4,<2.0" "pytest>=7.0" "pyscf==2.12.1" "numpy>=1.26" "scipy>=1.11" "h5py>=3.10"
      - run: .venv/bin/maturin develop --release
      - run: .venv/bin/pytest python/pyscf/tests/test_scf_stride_fuzz.py -x

  xplat-uhartree:
    name: Linux x86_64 + macOS aarch64 µHartree (Pitfall 12)
    needs: [maturin-smoke]
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-14]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-sibling-crates
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@v2
      # CRITICAL (checker iteration 1 BLOCKER 2): pin maturin >=1.4 so that
      # `--profile release-oracle` is honored (earlier maturin silently
      # falls back to [profile.release], which is FMA-enabled, voiding
      # Pitfall 12). No `||` fallback allowed.
      - name: Install maturin (>=1.4 — supports --profile)
        run: pip install "maturin>=1.4,<2.0" "pytest>=7.0" "numpy>=1.26" "h5py>=3.10"
      - name: Assert maturin >=1.4
        run: |
          MATURIN_VER=$(maturin --version | awk '{print $2}')
          python -c "import sys; v=tuple(int(x) for x in '$MATURIN_VER'.split('.')[:2]); sys.exit(0 if v >= (1,4) else 1)" || \
            (echo "FATAL: maturin $MATURIN_VER does not support --profile (need >=1.4). xplat-uhartree depends on release-oracle profile; --release would be FMA-enabled (Pitfall 12)."; exit 1)
      - name: Build pyscf-py under release-oracle profile (HARD REQUIREMENT, NO FALLBACK)
        # If `maturin develop --profile release-oracle` fails, this step
        # MUST exit non-zero. An earlier draft chained an `or-fallback` to
        # plain --release, which would silently drop to an FMA-enabled
        # profile, voiding the µHartree assertion. See checker iteration 1
        # BLOCKER 2. The literal fallback-string is NOT present here on
        # purpose so the verify grep stays clean.
        run: |
          python -m venv .upstream-venv
          .upstream-venv/bin/pip install "pyscf==2.12.1" "numpy>=1.26" "scipy>=1.11" "h5py>=3.10"
          python -m venv .venv
          .venv/bin/pip install "maturin>=1.4,<2.0" "pytest>=7.0" "pyscf==2.12.1" "numpy>=1.26" "scipy>=1.11" "h5py>=3.10"
          .venv/bin/maturin develop --profile release-oracle
      - name: H2O/STO-3G RHF — assert ≤ 1 µHartree vs upstream
        env:
          PYSCF_RS_UPSTREAM_PYTHON: ${{ github.workspace }}/.upstream-venv/bin/python
        run: .venv/bin/pytest python/pyscf/tests/test_scf_rhf_h2o.py -x --tb=short
      # cc-pVDZ µHartree gate: He/H2 (general contraction, d-free) + H2O (O d-shell,
      # l=2 → (dd|dd) needs nroots=5). H2O was demoted to STO-3G in 52b6965 over a
      # ~0.46 mHa d-shell Rys residual; the cintx rys_root3/4/5 intermediate-x port
      # closed that gap, so cc-pVDZ is a true µHartree gate again. REQUIRES two cintx
      # fixes on cintx main — the int2e general-contraction fix (two_electron.rs) and
      # the Rys intermediate-x branch port (math/rys.rs); setup-sibling-crates clones
      # cintx main, so this stays RED until both land there. Kernel-level twins:
      # pyscf-scf int2e_general_contraction (He/H2) + d_shell_rys (H2O).
      - name: He/H2/H2O cc-pVDZ RHF — assert ≤ 1 µHartree vs upstream (gen. contraction + d-shell)
        env:
          PYSCF_RS_UPSTREAM_PYTHON: ${{ github.workspace }}/.upstream-venv/bin/python
        run: .venv/bin/pytest python/pyscf/tests/test_scf_rhf_ccpvdz.py -x --tb=short

  python313t-smoke:
    name: python3.13t SCF smoke (BIND-05; NON-abi3 build per Pitfall (NEW))
    runs-on: ubuntu-latest
    needs: [build-default]
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-sibling-crates
      - name: Install Python 3.13t (free-threaded)
        # deadsnakes PPA path. Alternative: `uv python install 3.13t`.
        # If deadsnakes lacks 3.13-nogil on the runner image, switch to uv.
        run: |
          sudo add-apt-repository -y ppa:deadsnakes/ppa
          sudo apt-get update
          sudo apt-get install -y python3.13-nogil python3.13-venv || (
            pip install uv && uv python install 3.13t
          )
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@v2
      - name: Create 3.13t venv with maturin
        run: |
          PY=$(which python3.13t || which python3.13)
          "$PY" -m venv /tmp/venv313t
          /tmp/venv313t/bin/pip install "maturin>=1.4,<2.0" "numpy>=1.26"
      - name: Build pyscf-py (non-abi3 free-threading)
        run: |
          # CRITICAL per RESEARCH §"Pitfall (NEW)": abi3 wheels are incompatible
          # with 3.13t. We use --no-default-features --features free-threading
          # (drops abi3-py310 from the feature set) for this job ONLY.
          export VIRTUAL_ENV=/tmp/venv313t
          /tmp/venv313t/bin/maturin develop \
            --no-default-features --features free-threading
      # ── Checker iteration 1 NIT 6 ──────────────────────────────────
      # Assert the extension LOADS under 3.13t BEFORE the SCF smoke
      # runs. A segfault on `import pyscf._native` would otherwise
      # mask itself behind the `run: python -c "from pyscf import ..."`
      # shell exit code (which only fires after import succeeds).
      - name: Assert pyscf._native imports cleanly under 3.13t
        run: |
          cd python
          /tmp/venv313t/bin/python -c "import pyscf._native; print(pyscf._native.__doc__)"
      - name: SCF native surface smoke
        run: |
          cd python
          /tmp/venv313t/bin/python -c "
          from pyscf._native import scf
          assert hasattr(scf, 'RHF') and hasattr(scf, 'UHF') and hasattr(scf, 'GHF')
          print('OK 3.13t native SCF surface import')
          "

  # ── Phase 4 plan 04-10 ─────────────────────────────────────────────
  # DFT-03/DFT-11 CI surface: the gated libxc bit-exact job + the
  # wgpu-no-f64-fallback (DFT-11) job. See 04-10-PLAN.md.

  # DISABLED pending 04-02 (PENDING_LIBXC_RS_FEATURE_GATE): without libxc_rs
  # per-functional features this --features libxc job compiles all 266 kernels
  # (~6h). The sibling ~/Documents/workspace/libxc_rs repo still unconditionally
  # path-deps every `libxc-kernel-*` crate; until the per-functional feature
  # gate from plan 04-02 lands there, this job MUST NOT run on push/PR (it would
  # freeze CI for hours). It is gated `if: false` AND scoped to
  # `workflow_dispatch` only so it never auto-triggers. This is the ONLY job
  # that uses `--features libxc`; it is the dedicated, heavily-cached home for
  # the gated libxc compile (the [patch.crates-io] libxc_rs entry is inert in
  # every other job). Enable (flip `if: false` → a real gate, e.g.
  # `if: github.event_name == 'workflow_dispatch'`) when 04-02 lands.
  dft-libxc-bitexact:
    name: DFT libxc bit-exact (DISABLED pending 04-02 PENDING_LIBXC_RS_FEATURE_GATE)
    # HARD GATE: never run automatically. 04-02's per-functional feature gate is
    # PENDING, so `--features libxc` here would compile all 266 libxc kernels
    # (~6h). Keep `if: false` until PENDING_LIBXC_RS_FEATURE_GATE is resolved.
    if: false
    # Manual-trigger only even once `if:` is relaxed — the libxc compile is too
    # heavy for the push/PR path; it is a dedicated, on-demand, cached job.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-sibling-crates
        env:
          SETUP_LIBXC_RS: "1"
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
      # Heavy caching of the libxc_rs build artifacts (the 266-kernel compile is
      # the cost this job exists to amortise across runs).
      - uses: Swatinem/rust-cache@v2
        with:
          # Distinct cache key so the multi-hour libxc artifacts do not evict
          # the default-build cache shared by every other job.
          key: dft-libxc-bitexact
      # The ONLY `--features libxc` invocation in CI. It forwards ONLY the
      # corpus-subset per-functional features once 04-02 lands them (until then
      # this job stays disabled — see the `if: false` above). The bit-exact
      # assertions live in pyscf-dft's gated test files (04-05/04-06/04-07).
      - name: cargo test --features libxc (gated bit-exact corpus)
        run: |
          cargo test --features libxc -p pyscf-dft --locked -- --test-threads=1 \
            xc_eval_bitexact libxc_functional_smoke cam_b3lyp_h2o_rsh rks_uks_bitexact

  # ACTIVE — DFT-11 WGPU f64 honesty. Does NOT touch libxc (default features
  # only), so it is safe to run on every push/PR. On a shader-f64-less /
  # emulated runner (the ubuntu-latest default has no GPU adapter advertising
  # shader-f64), the DEFAULT-f64 path must fall back to CPU-f64 with a warning
  # and produce correct numbers — NEVER silently degrade to f32. The
  # `wgpu_f64_fallback` test (04-10) asserts this in-process (it forces the CPU
  # substrate via XCFUN_FORCE_BACKEND=cpu so the assertion is deterministic on
  # any runner; a genuinely shader-f64-less runner reaches the same Backend::Cpu
  # without the override). The optional second step ALSO exercises the explicit
  # D-08 escape hatch (PYSCF_DTYPE=f32) run-to-completion only (no oracle
  # compare).
  wgpu-no-f64-fallback:
    name: wgpu-no-f64-fallback (DFT-11 — CPU-f64 fallback + warn, never silent f32)
    runs-on: ubuntu-latest
    needs: [build-default]
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-sibling-crates
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@v2
      # DFT-11 default-f64 honesty: CPU-f64 fallback + warn, CPU-correct numbers.
      - name: DFT-11 default-f64 CPU fallback (no silent f32)
        run: cargo test -p pyscf-dft --locked wgpu_f64_fallback -- --test-threads=1
      # D-08 explicit escape hatch: PYSCF_DTYPE=f32 runs to completion on the
      # (shader-f64-less) adapter. RUN-TO-COMPLETION ONLY — no oracle compare,
      # no tolerance gate (f32 is never bit-exact compared to upstream).
      - name: D-08 explicit f32 escape hatch (run-to-completion only)
        env:
          PYSCF_DTYPE: f32
        run: cargo test -p pyscf-dft --locked dtype_f32_smoke -- --test-threads=1

  # ── Phase 5 plan 05-01 ─────────────────────────────────────────────
  # MP2 CI surface: an always-on structural job + a manual-dispatch upstream
  # numeric oracle job (cintx#11 closed in 05-08; the oracle now needs only an
  # upstream-PySCF install, hence workflow_dispatch). The always-on in-tree
  # numeric proof lives in pyscf-{gto,mp2}/tests (int2e_arity4, int3c2e_auxmol,
  # mp2_numeric_smoke).

  # ACTIVE — runs on every push/PR. Does NOT touch `--features python` or
  # `--features libxc`, so it is safe (no libpython, no 266-kernel libxc
  # compile). Asserts the MP2 structural/wiring layer: the always-on
  # synthetic AO→MO transform compile-smoke (pyscf-ao2mo), the MP2-08 CCSD
  # import-contract symbol-existence arm, and the RMP2/UMP2 structural
  # scaffolds. The numeric arms inside these crates are `#[ignore]`d (their
  # bodies land in plans 05-02..05-06) so this job is green on Wave-0 scaffolds.
  mp2-structural:
    name: mp2-structural (always-on MP2/ao2mo wiring + MP2-08 import contract)
    runs-on: ubuntu-latest
    needs: [build-default]
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-sibling-crates
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@v2
      - name: cargo test -p pyscf-mp2 -p pyscf-ao2mo (structural, no python)
        run: cargo test -p pyscf-mp2 -p pyscf-ao2mo --locked -- --test-threads=1

  # MANUAL-DISPATCH numeric oracle (upstream-PySCF byte-identity, ≤ 1 µHartree).
  # cintx#11 is CLOSED (05-08): cintx ships arity-4 `int2e` + arity-3
  # `int3c2e_sph` and pyscf-gto evaluates them, so the MP2 numeric oracle
  # (mp2_rmp2_energy, mp2_ump2_energy, dfmp2_energy, dfmp2_native_energy,
  # mp2_rdm) can now produce real correlation energies to compare vs upstream
  # `mp.RMP2(mf).kernel()` etc. under `--features python`. The REMAINING gate is
  # the same one every numeric oracle has — it needs an upstream-PySCF install,
  # which the default push/PR runners do not provide — so this is a
  # `workflow_dispatch` (manual / human-verify) arm, never auto-run (default CI
  # stays green). The always-on IN-TREE numeric proof (real int2e/int3c2e →
  # finite RMP2 e_corr; int3c2e finite/non-zero/symmetric) lives in
  # pyscf-gto/tests/int2e_arity4.rs + int3c2e_auxmol.rs +
  # pyscf-mp2/tests/mp2_numeric_smoke.rs. NOTE: the DF-MP2 numeric arm
  # additionally needs the Phase-3 rank-revealing DF-metric Cholesky
  # (the cc-pvdz-jkfit / weigend (P|Q) metric is ill-conditioned under the
  # current plain Cholesky-Banachiewicz).
  mp2-oracle-upstream-manual:
    name: mp2-oracle-upstream-manual (workflow_dispatch — upstream PySCF byte-identity)
    # Manual only: never auto-trigger on push/PR (default runners have no
    # upstream PySCF). cintx#11 is closed; this is the human-verify arm.
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-sibling-crates
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@v2
      # The oracle imports upstream `pyscf` via PyO3 (`--features python`) and
      # compares it against pyscf-rs in-process — install the reference.
      - name: Install upstream PySCF (oracle reference)
        run: pip install "numpy>=1.26" "pyscf>=2.5"
      # The ONLY MP2 `--features python` invocation. Exercises the five MP2
      # numeric oracle arms vs upstream PySCF now that cintx#11 ERIs land.
      - name: cargo test --features python (MP2 numeric oracle vs upstream)
        run: cargo test -p pyscf-oracle --features python --locked -- --test-threads=1

  # ── Phase 6 plan 06-11 ─────────────────────────────────────────────
  # CCSD CI surface: two ALWAYS-ON small-system arms (ccsd-structural +
  # heap-alloc-count) and two `workflow_dispatch`/human-verify arms
  # (ccsd-oracle-upstream-manual + python3.13t CCSD smoke). Honors the
  # user-memory constraint EXACTLY: the small arms run on every push; the
  # caffeine/DF-spill/upstream-byte-identity/3.13t arms are manual-only and NEVER
  # pull libxc (the 02-10 / 05-08 precedent + the libxc ~6h compile-freeze
  # hazard, T-06-11-FREEZE / T-06-11-SC).

  # ACTIVE — runs on every push/PR. Does NOT touch `--features python` or
  # `--features libxc`, so it is safe (no libpython, no 266-kernel libxc
  # compile). Runs ALL the small always-on CCSD arms (the real in-tree NUMERIC
  # proofs already proven this phase): rccsd_numeric_smoke (CCSD-01: H2/STO-3G
  # e_corr ~ -0.020525 to <= 1 µHartree), uccsd_smoke (CCSD-02: UCCSD(α==β) ==
  # RCCSD), convergence, diis_amps, diagnostics, frozen, dfccsd_spill (in-tree
  # spill proof), direct (CCSD-07: AO-direct == in-core), lambda, rdm, refusal.
  # Clone of `mp2-structural` (ci.yml:416).
  ccsd-structural:
    name: ccsd-structural (always-on small-system CCSD arms; no python, no libxc)
    runs-on: ubuntu-latest
    needs: [build-default]
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-sibling-crates
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@v2
      - name: cargo test -p pyscf-ccsd -p pyscf-oracle (structural, no python)
        run: cargo test -p pyscf-ccsd -p pyscf-oracle --locked -- --test-threads=1

  # ACTIVE — runs on every push/PR. The CCSD-11 allocate-once-reuse gate
  # (RESEARCH §A3). The `heap_alloc_count` integration-test target installs its
  # OWN counting `#[global_allocator]` scoped to THAT binary only (each
  # integration test compiles to its own crate, so the counting shim never
  # perturbs the oracle/determinism bit-exactness arms — the A3 isolation
  # requirement). Run as a DEDICATED `--test heap_alloc_count` arm (not folded
  # into ccsd-structural) so the allocator instrumentation stays isolated. Also
  # runs the `refusal` arm (CCSD-11 over-budget in-core HARD-refuse,
  # `MemoryLimitExceeded`). NO `--features python`, NO libxc.
  ccsd-heap-alloc-count:
    name: heap-alloc-count (CCSD-11 allocate-once + over-budget refusal; always-on)
    runs-on: ubuntu-latest
    needs: [build-default]
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-sibling-crates
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@v2
      - name: cargo test -p pyscf-ccsd --test heap_alloc_count --test refusal
        run: |
          cargo test -p pyscf-ccsd --test heap_alloc_count --test refusal --locked \
            -- --test-threads=1

  # MANUAL-DISPATCH numeric oracle (upstream-PySCF byte-identity, ≤ 1 µHartree).
  # `--features python` drives upstream `cc.CCSD(mf).kernel()` /
  # `cc.UCCSD(uhf).kernel()` / `cc.CCSD(mf.density_fit()).kernel()` /
  # `.solve_lambda()` / `.make_rdm1()` / `.make_rdm2()` in-process and compares
  # against pyscf-rs: caffeine/cc-pVDZ RCCSD byte-identity, UCCSD open-shell
  # byte-identity, the DF-CCSD `Wabef`→HDF5 spill proof on a deliberately
  # constrained `PYSCF_MAX_MEMORY` (benzene-dimer/cc-pVDZ), and λ/RDM
  # byte-identity. This needs an installed upstream PySCF, which the default
  # push/PR runners do not provide — so it is `workflow_dispatch` (manual /
  # human-verify) ONLY, never auto-run (default CI stays green + never freezes;
  # the 05-08 mp2-oracle-upstream-manual precedent). The always-on IN-TREE
  # small-system numeric proofs live in crates/pyscf-ccsd/tests (run by the
  # ccsd-structural arm above). NEVER pulls libxc.
  ccsd-oracle-upstream-manual:
    name: ccsd-oracle-upstream-manual (workflow_dispatch — caffeine/DF-spill/λ/RDM byte-identity)
    # Manual only: never auto-trigger on push/PR (default runners have no
    # upstream PySCF; the caffeine/DF-spill arms are slow + memory-heavy). This
    # is the documented phase-gate human-verify arm.
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    # The DF-CCSD spill proof drives a deliberately constrained memory budget so
    # the `vvL`/`Wabef` reservation is forced through the HDF5-spill backend.
    env:
      PYSCF_MAX_MEMORY: "500"
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-sibling-crates
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@v2
      # The oracle imports upstream `pyscf` via PyO3 (`--features python`) and
      # compares it against pyscf-rs in-process — install the reference.
      - name: Install upstream PySCF (oracle reference)
        run: pip install "numpy>=1.26" "pyscf>=2.5"
      # The ONLY CCSD `--features python` invocation. Exercises the six CCSD
      # numeric oracle arms once their live Python dispatch wiring lands. For
      # now this compiles the python-enabled oracle surface and leaves the
      # `#[ignore]`'d live byte-identity arms for human verification.
      - name: cargo test --features python (CCSD byte-identity vs upstream)
        run: |
          cargo test -p pyscf-oracle --features python --locked \
            -- --test-threads=1 ccsd

  # MANUAL-DISPATCH python3.13t free-threaded CCSD surface smoke. The
  # free-threaded job intentionally avoids upstream PySCF/h5py: current 3.13t
  # h5py resolves to a source build on ubuntu-latest and requires system HDF5.
  # Numeric SCF/CCSD coverage stays in the 3.11 and oracle jobs; this job checks
  # the non-abi3 extension and CCSD binding surface under 3.13t.
  python313t-ccsd-smoke:
    name: python3.13t CCSD smoke (Pitfall 6 GIL re-validation; workflow_dispatch)
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    needs: [build-default]
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-sibling-crates
      - name: Install Python 3.13t (free-threaded)
        # deadsnakes PPA path. Alternative: `uv python install 3.13t`.
        run: |
          sudo add-apt-repository -y ppa:deadsnakes/ppa
          sudo apt-get update
          sudo apt-get install -y python3.13-nogil python3.13-venv || (
            pip install uv && uv python install 3.13t
          )
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@v2
      - name: Create 3.13t venv with maturin
        run: |
          PY=$(which python3.13t || which python3.13)
          "$PY" -m venv /tmp/venv313t
          /tmp/venv313t/bin/pip install "maturin>=1.4,<2.0" "numpy>=1.26"
      - name: Build pyscf-py (non-abi3 free-threading)
        run: |
          # abi3 wheels are incompatible with 3.13t — use
          # --no-default-features --features free-threading (drops abi3-py310).
          export VIRTUAL_ENV=/tmp/venv313t
          /tmp/venv313t/bin/maturin develop \
            --no-default-features --features free-threading
      - name: Assert pyscf._native imports cleanly under 3.13t
        run: |
          cd python
          /tmp/venv313t/bin/python -c "import pyscf._native; print(pyscf._native.__doc__)"
      - name: CCSD native surface smoke
        run: |
          cd python
          /tmp/venv313t/bin/python -c "
          from pyscf._native import cc
          assert hasattr(cc, 'CCSD') and hasattr(cc, 'RCCSD')
          assert hasattr(cc, 'UCCSD') and hasattr(cc, 'DFCCSD')
          print('OK 3.13t native CCSD surface import')
          "

  # ── Phase 7 plan 07-10 ─────────────────────────────────────────────
  # Gradients + geomopt CI surface (D-01/D-05). THREE gate groups, mirroring the
  # `mp2-structural` / `mp2-oracle-upstream-manual` (ci.yml:463-513) +
  # `ccsd-structural` (ci.yml:532-544) precedent:
  #
  #   1. ALWAYS-ON `grad-structural` (runs on every push/PR): the FD
  #      self-verification gate (`verify_fd`, D-01, GRAD-09, <=1e-6 Ha/Bohr — NO
  #      upstream PySCF needed; the FIRST always-on NUMERIC gate in the project) +
  #      the structural arms (`atmlst` subset GRAD-08, `single_cphf_impl` GRAD-10)
  #      + the self-contained geomopt convergence gate (H2O->equilibrium,
  #      GEOMOPT-07) + bmatrix/rfo/conv_defaults (GEOMOPT-04/06). Scoped to
  #      `-p pyscf-grad -p pyscf-geomopt -p pyscf-oracle`, NO `--features python`,
  #      NO `--features libxc` (T-07-35 — the ~6h libxc compile freeze).
  #
  #   2. CI `geomopt-no-runtime-dep` (GEOMOPT-01, runs on every push/PR per D-05,
  #      NOT workflow_dispatch): `pip uninstall -y geometric pyberny` then prove
  #      `pyscf.geomopt.optimize(mf)` still works — the geometry optimizer is
  #      FULLY NATIVE, with NO `geometric`/`pyberny` runtime dependency (T-07-38).
  #
  #   3. `workflow_dispatch` `grad-oracle-upstream-manual` (manual / human-verify
  #      ONLY): upstream byte-identity analytical gradient (<=1e-7 Ha/Bohr vs
  #      `pyscf/grad/*`) + geomopt trajectory / stationary-point parity vs
  #      `geometric_solver`. Default runners have no upstream PySCF/geomeTRIC
  #      (T-07-37), AND these arms ride the cintx grad-intor gate (6/8 families
  #      MISSING from cintx, 07-01) — so they stay manual until BOTH an upstream
  #      install AND the cintx grad-intor workstream are present.
  #
  # `--test-threads=1` everywhere (T-07-36 — determinism); setup-sibling-crates
  # provides cintx; the dependency-wall lint stays green (T-07-SC, zero edits).

  # ACTIVE — runs on every push/PR. Does NOT touch `--features python` or
  # `--features libxc`, so it is safe (no libpython, no 266-kernel libxc
  # compile). Runs the always-on FD self-verification gate (verify_fd, D-01,
  # GRAD-09, <=1e-6 Ha/Bohr — needs NO upstream PySCF) + the structural arms
  # (atmlst GRAD-08, single_cphf_impl GRAD-10) + the self-contained geomopt
  # convergence gate (h2o_equilibrium GEOMOPT-07) + bmatrix/rfo/conv_defaults
  # (GEOMOPT-04/06) + the pyscf-oracle grad/geomopt dispatch-layer registration
  # arms (07-10). Clone of `mp2-structural` / `ccsd-structural`.
  grad-structural:
    name: grad-structural (always-on verify_fd + atmlst + single-CPHF + geomopt convergence; no python, no libxc)
    runs-on: ubuntu-latest
    needs: [build-default]
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-sibling-crates
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@v2
      - name: cargo test -p pyscf-grad -p pyscf-geomopt -p pyscf-oracle (structural, no python)
        run: cargo test -p pyscf-grad -p pyscf-geomopt -p pyscf-oracle --locked -- --test-threads=1

  # ACTIVE — runs on every push/PR (GEOMOPT-01 proof, per D-05; NOT
  # workflow_dispatch). Proves the geometry optimizer is FULLY NATIVE: after
  # `pip uninstall -y geometric pyberny`, `pyscf.geomopt.optimize(mf)` must still
  # succeed (the optimizer + B-matrix + RFO are the in-tree pyscf-geomopt BFGS+RFO
  # engine; both `geometric_solver` and `berny_solver` are thin aliases over the
  # ONE native engine, D-06/T-07-20). Builds the abi3 wheel via `maturin develop`
  # (the maturin-smoke precedent, ci.yml:213) so the `pyscf.grad`/`pyscf.geomopt`
  # overlays + the `_native.geomopt` engine are importable. Imports `pyscf.grad`
  # FIRST so `_graft_nuc_grad_onto_scf` grafts `mf.nuc_grad_method()` onto the
  # native SCF/DFT pyclasses before the optimize call resolves it. NO
  # `--features libxc` (T-07-35), NO upstream PySCF. The analytical-grad NUMERIC
  # rides the cintx gate (07-01), so this proof asserts the optimize ENTRY POINT
  # resolves + runs natively (catching a cintx-availability error as the
  # documented gated outcome, never a missing-geometric/pyberny ImportError).
  geomopt-no-runtime-dep:
    name: geomopt-no-runtime-dep (GEOMOPT-01 — pip uninstall geometric pyberny; native optimizer)
    runs-on: ubuntu-latest
    needs: [build-default]
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-sibling-crates
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@v2
      - name: Install maturin (>=1.4) + numpy (NO geometric, NO pyberny, NO upstream pyscf)
        run: |
          python -m venv .venv
          .venv/bin/pip install "maturin>=1.4,<2.0" "numpy>=1.26" "scipy>=1.11" "h5py>=3.10"
      - name: Build + install pyscf-rs into venv
        run: .venv/bin/maturin develop --release
      # GEOMOPT-01: prove NO geometric/pyberny runtime dependency. Uninstall both
      # external optimizer packages (|| true: they are not installed in the first
      # place — the assertion is that the optimizer runs WITHOUT them), then run
      # the native optimize entry point.
      - name: pip uninstall -y geometric pyberny (prove they are not a runtime dep)
        run: .venv/bin/pip uninstall -y geometric pyberny || true
      - name: Assert geometric/pyberny are NOT importable (clean env)
        run: |
          cd python
          ../.venv/bin/python -c "
          import importlib.util as u
          for pkg in ('geometric', 'pyberny'):
              assert u.find_spec(pkg) is None, f'{pkg} unexpectedly present — the no-runtime-dep proof is void'
          print('OK: neither geometric nor pyberny is installed')
          "
      - name: import pyscf.geomopt; optimize(mf) runs natively (GEOMOPT-01)
        run: |
          cd python
          ../.venv/bin/python -c "
          # Import the grad overlay FIRST so _graft_nuc_grad_onto_scf grafts
          # mf.nuc_grad_method() onto the native SCF/DFT pyclasses, then the
          # geomopt overlay (NO external geometric/pyberny import — GEOMOPT-01).
          import pyscf.grad      # grafts nuc_grad_method
          import pyscf.geomopt   # the fully-native optimizer entry point
          from pyscf._native import gto, scf
          assert hasattr(pyscf.geomopt, 'optimize')
          assert hasattr(pyscf.geomopt, 'geometric_solver')
          assert hasattr(pyscf.geomopt, 'berny_solver')
          mol = gto.Mole('H 0 0 0; H 0 0 0.74', basis='sto-3g')
          mf = scf.RHF(mol)
          try:
              opt_mol = pyscf.geomopt.optimize(mf, maxsteps=2)
              print('OK: native optimize(mf) ran to a result without geometric/pyberny')
          except Exception as e:  # noqa: BLE001
              # The analytical gradient rides the cintx grad-intor gate (07-01):
              # a clean cintx-availability error here is the DOCUMENTED gated
              # outcome. What GEOMOPT-01 forbids is a missing-geometric/pyberny
              # ImportError — assert the failure is NOT that.
              msg = repr(e).lower()
              assert 'geometric' not in msg and 'pyberny' not in msg, (
                  'optimize failed due to a missing external optimizer package '
                  '— GEOMOPT-01 (no-runtime-dep) VIOLATED: ' + repr(e)
              )
              assert not isinstance(e, ImportError), (
                  'optimize raised ImportError — the native optimizer must not '
                  'import an external package: ' + repr(e)
              )
              print('OK: native optimize(mf) resolved + ran (gated on the cintx '
                    'grad-intor workstream, NOT on geometric/pyberny): ' + repr(e))
          "

  # MANUAL-DISPATCH upstream byte-identity (≤ 1e-7 Ha/Bohr) + geomopt trajectory
  # parity. `--features python` drives upstream `mf.nuc_grad_method().kernel()` /
  # `pyscf/grad/*` + `geometric_solver` in-process and compares against pyscf-rs:
  # RHF/UHF/RKS/UKS/MP2/CCSD/ECP analytical-gradient byte-identity + the H2O
  # geometry-optimizer trajectory / stationary-point parity. This needs an
  # installed upstream PySCF (+ geomeTRIC), which the default push/PR runners do
  # not provide — AND it rides the cintx grad-intor gate (6/8 gradient-integral
  # families MISSING from cintx, 07-01) — so it is `workflow_dispatch` (manual /
  # human-verify) ONLY, never auto-run (default CI stays green + never freezes;
  # the 05-08 / 06-11 precedent). The always-on FD-structural + the geomopt
  # convergence proofs live in the grad-structural arm above. NEVER pulls libxc.
  grad-oracle-upstream-manual:
    name: grad-oracle-upstream-manual (workflow_dispatch — upstream byte-identity <=1e-7 + geomopt trajectory parity)
    # Manual only: never auto-trigger on push/PR (default runners have no
    # upstream PySCF/geomeTRIC; the analytical grad rides the cintx grad-intor
    # gate). This is the documented phase-gate human-verify arm.
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-sibling-crates
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@v2
      # The oracle imports upstream `pyscf` (+ geomeTRIC for the trajectory arm)
      # via PyO3 (`--features python`) and compares it against pyscf-rs in-process
      # — install the references.
      - name: Install upstream PySCF + geomeTRIC (oracle references)
        run: pip install "numpy>=1.26" "pyscf>=2.5" "geometric>=1.0"
      # The ONLY grad/geomopt `--features python` invocation. Exercises the eight
      # grad/geomopt numeric oracle arms (nuc_grad_* byte-identity <=1e-7 Ha/Bohr
      # + geomopt_h2o trajectory parity) vs upstream once their live Python
      # dispatch wiring + the cintx grad-intor workstream land. For now this
      # compiles the python-enabled oracle surface and runs the registered
      # `#[ignore]`'d arms via `--include-ignored` (the human-verify step).
      - name: cargo test --features python (grad/geomopt byte-identity + trajectory vs upstream)
        run: |
          cargo test -p pyscf-oracle --features python --locked \
            -- --test-threads=1 --include-ignored grad geomopt
