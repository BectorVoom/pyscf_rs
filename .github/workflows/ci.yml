# Pre-merge CI for the pyscf-rs Rust workspace.
#
# This file replaces the upstream-PySCF Python `ci.yml` because pyscf-rs is a
# pure-Rust port (see Cargo.toml [workspace] root). Other upstream workflows
# (lint.yml, ci_conda.yml, publish.yml) are left untouched — they target the
# Python sources under pyscf/ which are kept only for reference until the
# Rust port reaches feature parity.
#
# Coverage: ROADMAP success criteria 1, 2, 3, 5, 6:
#   1. cargo build --workspace --locked (default + --features gpu)
#   2. xtask check-no-fma (release-oracle FMA grep, FOUND-05)
#   3. oracle-determinism × 2 (RAYON_NUM_THREADS=1 and =8)
#   5. four lints: clippy unwrap deny + check-forbidden-paths +
#      check-catch-unwind + check-dependency-wall (+ check-cubecl-pin)
#   6. select_backend env-var truth table (covered by cargo test)
name: CI

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:

env:
  # FOUND-05 + Pitfall 1: explicitly empty so no GitHub-Actions-default
  # fast-math sneaks in. The .cargo/config.toml [build] rustflags
  # supply -fp-contract=off + -target-feature=-fma,-fma4 (Plan 01).
  RUSTFLAGS: ""
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"

jobs:
  fmt:
    name: cargo fmt --check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          components: rustfmt
      - run: cargo fmt --all -- --check

  clippy:
    name: cargo clippy -D warnings (FOUND-07 unwrap deny)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings

  build-default:
    name: cargo build --workspace (default features = cpu)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --workspace --locked

  build-gpu:
    name: cargo build --workspace --features gpu (Pitfall 7 cuda+wgpu compile-only)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@v2
      # cuda+wgpu probe arms compile even without GPU hardware (RESEARCH
      # Pitfall 7 — type-check the gpu-gated arms early so a Phase 4
      # mistake does not go unnoticed for weeks).
      - run: cargo build --workspace --locked --features gpu

  test:
    name: cargo test --workspace
    runs-on: ubuntu-latest
    needs: [build-default]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace --locked --no-fail-fast -- --test-threads=1

  # ROADMAP success criterion 3 — Pitfall 2 SHOWSTOPPER mitigation.
  # Two jobs in matrix: rayon-1 vs rayon-8. Both run release-oracle
  # profile (FOUND-05 FMA-free) and the oracle_determinism integration
  # test (Plan 04). The bit-identical contract is asserted in-process
  # by the test — these CI jobs prove it survives across thread-count
  # configurations.
  oracle-determinism:
    name: oracle-determinism (RAYON_NUM_THREADS=${{ matrix.rayon }})
    runs-on: ubuntu-latest
    needs: [build-default]
    strategy:
      fail-fast: false
      matrix:
        rayon: ["1", "8"]
    env:
      RAYON_NUM_THREADS: ${{ matrix.rayon }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --profile release-oracle -p pyscf-algebra --test oracle_determinism --locked -- --test-threads=1

  # FOUND-05: the FMA grep gate. Runs xtask check-no-fma which builds
  # pyscf-algebra + pyscf-core under release-oracle, scans the asm,
  # and fails on any FMA mnemonic.
  xtask-no-fma:
    name: xtask check-no-fma (FOUND-05 / Pitfall 1)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo run --quiet -p xtask --bin check-no-fma

  # FOUND-08 / Pitfall 21: scope-creep gate.
  xtask-forbidden-paths:
    name: xtask check-forbidden-paths (FOUND-08 / Pitfall 21)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo run --quiet -p xtask --bin check-forbidden-paths

  # FOUND-07 / Pitfall 14: catch_unwind on every extern "C" gate.
  xtask-catch-unwind:
    name: xtask check-catch-unwind (FOUND-07 / Pitfall 14)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo run --quiet -p xtask --bin check-catch-unwind

  # ALG-06: cubecl-* containment gate.
  xtask-dependency-wall:
    name: xtask check-dependency-wall (ALG-06)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo run --quiet -p xtask --bin check-dependency-wall

  # FOUND-04: cubecl 0.10.0 lockstep gate.
  xtask-cubecl-pin:
    name: xtask check-cubecl-pin (FOUND-04 / Pitfall 1)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo run --quiet -p xtask --bin check-cubecl-pin

  # FOUND-10: license + advisory + bans gating.
  cargo-deny:
    name: cargo deny check (FOUND-10)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo install --locked cargo-deny@0.19.5
      - run: cargo deny check
