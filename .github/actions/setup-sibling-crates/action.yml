name: Setup sibling crates
description: Clone sibling Rust crates expected by local path dependencies.
runs:
  using: composite
  steps:
    - name: Clone sibling repositories
      shell: bash
      run: |
        set -euo pipefail

        parent="$(dirname "$GITHUB_WORKSPACE")"

        clone_sibling() {
          local repo="$1"
          local dest="$parent/$repo"

          rm -rf "$dest"
          git clone --depth 1 "https://github.com/BectorVoom/${repo}.git" "$dest"
        }

        clone_libxc_rs() {
          local dest="$parent/libxc_rs"

          rm -rf "$dest"
          case "${SETUP_LIBXC_RS:-}" in
            1|true|TRUE|yes|YES)
              git clone --depth 1 "https://github.com/BectorVoom/libxc_rs.git" "$dest"
              ;;
            *)
              git clone --depth 1 --filter=blob:none --sparse "https://github.com/BectorVoom/libxc_rs.git" "$dest"
              git -C "$dest" sparse-checkout set src crates/kernels/math
              ;;
          esac
        }

        clone_sibling cintx
        clone_sibling xcfun_rs
        clone_libxc_rs
